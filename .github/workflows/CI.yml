name: CI
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          persist-credentials: false

      - name: Setup tools (mise)
        uses: jdx/mise-action@1c992c2b17638065c8d3f9973853aeea39f52576
        with:
          cache: true
          experimental: true

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01

      - name: Run build
        id: build
        run: mise build

      - name: Run tests
        id: tests
        run: mise test

      - name: Report CI result in PR
        if: always()
        run: ./.github/scripts/report-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}